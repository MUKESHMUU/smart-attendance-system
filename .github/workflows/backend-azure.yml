# Deploys ONLY the backend/ folder to Azure App Service on every push to main.
# Setup: in Azure Portal > your App Service > Overview > "Get publish profile" (download),
# then GitHub repo > Settings > Secrets and variables > Actions > New secret:
#   AZURE_WEBAPP_PUBLISH_PROFILE = (paste the whole file contents)
# and a repository VARIABLE:  AZURE_WEBAPP_NAME = your-app-name
name: Deploy backend to Azure
on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install production dependencies
        run: npm ci --omit=dev
        working-directory: backend
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
